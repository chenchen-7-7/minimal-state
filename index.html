<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>状态日历</title>
  <style>
    :root{--ink:#202525;--muted:#737a78;--paper:#f7f5ef;--card:#fffdf8;--line:#e9e5dc;--despair:#bd6e70;--avoid:#e2ae54;--hope:#5baf90}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px 70px}header{display:flex;justify-content:space-between;align-items:start;margin-bottom:28px}h1{margin:0;font-size:34px;letter-spacing:-1.5px}.subtitle{color:var(--muted);margin:8px 0 0}.date{font-size:14px;color:var(--muted);padding-top:8px}.layout{display:grid;grid-template-columns:1.16fr .84fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 30px rgba(69,58,33,.035)}h2{font-size:18px;margin:0 0 18px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-size:20px;font-weight:750}.nav{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:20px}.jumpbar{display:flex;gap:7px;margin-bottom:18px}.jumpbar input{min-width:0;flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit}.jumpbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px}.jumpbar .today-btn{background:var(--ink);border-color:var(--ink);color:#fff}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekdays{margin-bottom:7px;color:var(--muted);font-size:12px;text-align:center}.day{position:relative;aspect-ratio:1;border:1px solid transparent;background:#fff;border-radius:13px;cursor:pointer;color:var(--ink);text-align:left;padding:8px;font:inherit}.day:hover{border-color:#c9c1af}.day.despair{background:var(--despair);color:#fff}.day.avoid{background:var(--avoid);color:#493812}.day.hope{background:var(--hope);color:#fff}.outside:not(.despair):not(.avoid):not(.hope){color:#c9c7bf;background:transparent}.today{box-shadow:inset 0 0 0 1px var(--ink)}.selected{outline:3px solid #313837;outline-offset:1px}.hint{color:var(--muted);font-size:13px;margin:17px 0 0}.selection{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}.selection h3{font-size:14px;margin:0 0 12px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.level{border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px 8px;cursor:pointer;font:inherit;color:var(--ink)}.level b{display:block;font-size:15px}.level small{color:var(--muted);font-size:11px}.level.active{box-shadow:inset 0 0 0 2px var(--ink)}.level.despair.active{border-color:var(--despair)}.level.avoid.active{border-color:var(--avoid)}.level.hope.active{border-color:var(--hope)}.remove,.clear{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}.remove{display:block;margin:13px auto 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1eee6;padding:5px;border-radius:12px;margin:-5px 0 14px}.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 4px;cursor:pointer;font:inherit;color:var(--muted);font-size:13px}.tabs button.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px #cfcabf}.stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eef5ef;border-radius:12px;padding:10px 13px;margin:18px 0 14px}.eyebrow{font-size:12px;color:#47665a}.stat-top strong{font-size:18px;white-space:nowrap}.stat-top p{display:none}.pie-row{display:flex;align-items:center;gap:18px;margin:4px 0 20px}.pie{width:130px;height:130px;flex:none}.legend{display:grid;gap:10px;width:100%}.legend div{display:flex;justify-content:space-between;gap:8px;font-size:14px}.key{display:flex;align-items:center;gap:7px}.key i{display:inline-block;width:9px;height:9px;border-radius:50%}.line-title{border-top:1px solid var(--line);padding-top:20px;margin:0 0 9px;font-size:16px}.line-wrap{height:190px}.line-chart{width:100%;height:100%;overflow:visible}.line-chart text{fill:var(--muted);font-size:10px}.empty-chart{display:flex;height:150px;align-items:center;justify-content:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}.legend-note{margin:14px 0;color:var(--muted);font-size:12px;line-height:1.55}@media(max-width:760px){main{padding:27px 16px 48px}header{display:block}.date{padding-top:13px}.layout{grid-template-columns:1fr}.day{border-radius:10px;padding:6px}.levels{gap:6px}.level{padding:11px 4px}.pie-row{gap:9px}.pie{width:130px;height:130px}}
    .daily-title{border-top:1px solid var(--line);padding-top:20px;margin:20px 0 10px;font-size:16px}.daily-grid{display:grid;grid-template-columns:repeat(var(--columns),1fr);gap:3px;aspect-ratio:1;background:#f2f0e9;padding:5px;border-radius:14px}.daily-cell{border:0;border-radius:3px;background:#fff;cursor:pointer;min-width:0;padding:0}.daily-cell:hover{outline:2px solid var(--ink);z-index:1}.daily-cell.empty{visibility:hidden}.daily-cell.despair{background:var(--despair)}.daily-cell.avoid{background:var(--avoid)}.daily-cell.hope{background:var(--hope)}.daily-cell.today-cell{box-shadow:inset 0 0 0 1px var(--ink)}.daily-key{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:9px}.daily-key span{display:flex;align-items:center;gap:4px}.daily-key i{width:8px;height:8px;border-radius:2px;background:#fff;border:1px solid var(--line)}.daily-key i.despair{background:var(--despair);border:0}.daily-key i.avoid{background:var(--avoid);border:0}.daily-key i.hope{background:var(--hope);border:0}
  </style>
</head>
<body>
<main>
  <header><div><h1>极简状态</h1><p class="subtitle">每天一个选择，慢慢看见自己的节奏。</p></div><div class="date" id="today"></div></header>
  <section class="layout">
    <section class="card">
      <div class="calendar-head"><button class="nav" id="prev" aria-label="上个月">‹</button><div class="month" id="month"></div><button class="nav" id="next" aria-label="下个月">›</button></div>
      <div class="jumpbar"><input id="jumpMonth" type="month" aria-label="选择年月"><button id="jump">跳转</button><button class="today-btn" id="goToday">回到今日</button></div>
      <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="days" id="days"></div>
      <p class="hint" id="hint"></p>
      <div class="selection"><h3>为这一天选择状态</h3><div class="levels" id="levels"><button class="level despair" data-v="1"><b>绝望</b><small>几乎没有力气</small></button><button class="level avoid" data-v="2"><b>逃避</b><small>想先躲开一切</small></button><button class="level hope" data-v="3"><b>希望</b><small>仍愿意向前一点</small></button></div><button class="remove" id="remove">移除这一天的记录</button></div>
    </section>
    <aside class="card">
      <h2>趋势统计</h2><div class="tabs" id="tabs"><button class="active" data-range="week">周统计</button><button data-range="month">月统计</button><button data-range="year">年统计</button></div>
      <h3 class="daily-title" style="border-top:0;padding-top:0;margin-top:0">每日状态</h3><div class="daily-grid" id="dailyGrid"></div><div class="daily-key"><span><i></i>未记录</span><span><i class="despair"></i>绝望</span><span><i class="avoid"></i>逃避</span><span><i class="hope"></i>希望</span></div>
      <div class="stat-top" id="stat"></div><div class="pie-row"><svg class="pie" id="pie" viewBox="0 0 42 42"></svg><div class="legend" id="legend"></div></div>
      <h3 class="line-title">状态变化趋势</h3><div class="line-wrap" id="line"></div><p class="legend-note" id="chartNote"></p><button class="clear" id="clear">清空所有本机记录</button>
    </aside>
  </section>
</main>
<script>
const KEY='daily-energy-v1',labels=['绝望','逃避','希望'],classes=['despair','avoid','hope'],colors=['#bd6e70','#e2ae54','#5baf90'];
const today=new Date(),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),monthFmt=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long'}),fullFmt=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'});
let shown=new Date(today.getFullYear(),today.getMonth(),1),chosen=iso(today),range='week';
const el=s=>document.querySelector(s),days=el('#days'),levels=el('#levels');
el('#today').textContent=fullFmt.format(today);
function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function put(rows){localStorage.setItem(KEY,JSON.stringify(rows))}
function val(date){return all().find(x=>x.date===date)?.energy}
function record(date,energy){put([...all().filter(x=>x.date!==date),{date,energy}]);render()}
function bounds(){let selected=new Date(chosen+'T12:00:00'),start,end,label;
  if(range==='week'){let offset=(selected.getDay()+6)%7;start=new Date(selected);start.setDate(selected.getDate()-offset);end=new Date(start);end.setDate(start.getDate()+6);label='本周'}
  else if(range==='month'){start=new Date(shown.getFullYear(),shown.getMonth(),1);end=new Date(shown.getFullYear(),shown.getMonth()+1,0);label=monthFmt.format(shown)}
  else{start=new Date(shown.getFullYear(),0,1);end=new Date(shown.getFullYear(),11,31);label=shown.getFullYear()+'年'}
  return {start,end,label};
}
function renderCalendar(){el('#month').textContent=monthFmt.format(shown);el('#jumpMonth').value=shown.getFullYear()+'-'+String(shown.getMonth()+1).padStart(2,'0');days.innerHTML='';let first=new Date(shown.getFullYear(),shown.getMonth(),1),offset=(first.getDay()+6)%7,start=new Date(shown.getFullYear(),shown.getMonth(),1-offset);
  for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=iso(d),v=val(date),b=document.createElement('button');b.className='day '+(d.getMonth()!==shown.getMonth()?'outside ':'')+(v?classes[v-1]+' ':'')+(date===iso(today)?'today ':'')+(date===chosen?'selected ':'');b.textContent=d.getDate();b.onclick=()=>{chosen=date;shown=new Date(d.getFullYear(),d.getMonth(),1);render()};days.append(b)}
}
function renderPicker(){let v=val(chosen);el('#hint').textContent='已选日期：'+fullFmt.format(new Date(chosen+'T12:00:00'))+(v?' · 当前为「'+labels[v-1]+'」':' · 尚未记录');levels.querySelectorAll('button').forEach(b=>b.classList.toggle('active',+b.dataset.v===v))}
function data(){let b=bounds();return all().filter(x=>{let d=new Date(x.date+'T12:00:00');return d>=b.start&&d<=b.end}).sort((a,b)=>a.date.localeCompare(b.date))}
function pie(rows){let counts=[0,0,0];rows.forEach(x=>counts[x.energy-1]++);let total=rows.length,at=0,parts=[];counts.forEach((n,i)=>{let p=total?n/total*100:0;parts.push('<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="'+colors[i]+'" stroke-width="8" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+(-at)+'"/>');at+=p});el('#pie').innerHTML=total?parts.join(''):'<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#e9e5dc" stroke-width="8"/>';el('#legend').innerHTML=counts.map((n,i)=>'<div><span class="key"><i style="background:'+colors[i]+'"></i>'+labels[i]+'</span><b>'+(total?Math.round(n/total*100):0)+'%</b></div>').join('')}
function line(rows){if(!rows.length){el('#line').innerHTML='<div class="empty-chart">在这个范围内记录后，会在这里显示趋势。</div>';return}let w=330,h=170,p={l:25,r:12,t:15,b:24},iw=w-p.l-p.r,ih=h-p.t-p.b,b=bounds(),series=rows;
  if(range==='year'){let groups=Array.from({length:12},()=>[]);rows.forEach(x=>groups[+x.date.slice(5,7)-1].push(x.energy));series=groups.map((g,i)=>g.length?{position:i,energy:g.reduce((s,v)=>s+v,0)/g.length,label:(i+1)+'月'}:null).filter(Boolean)}
  let span=range==='year'?11:Math.max(1,b.end-b.start),xy=x=>{let position=range==='year'?x.position:new Date(x.date+'T12:00:00')-b.start;return[p.l+position/span*iw,p.t+(3-x.energy)/2*ih]},pts=series.map(x=>{let q=xy(x);return{x:q[0],y:q[1],energy:x.energy}}),smooth=pts.length===1?'M '+pts[0].x+' '+pts[0].y:'M '+pts[0].x+' '+pts[0].y+pts.slice(0,-1).map((a,i)=>{let p0=pts[i-1]||a,p1=a,p2=pts[i+1],p3=pts[i+2]||p2,c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;return ' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y}).join(''),grid=[1,2,3].map(v=>{let y=p.t+(3-v)/2*ih;return '<line x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+y+'" y2="'+y+'" stroke="#e9e5dc"/><text x="0" y="'+(y+3)+'">'+labels[v-1]+'</text>'}).join(''),dots=pts.map(x=>'<circle cx="'+x.x+'" cy="'+x.y+'" r="'+(range==='year'?4:3)+'" fill="'+(x.energy<1.5?colors[0]:x.energy<2.5?colors[1]:colors[2])+'"/>').join(''),xAxis=range==='year'?'<text x="'+p.l+'" y="'+(h-3)+'">1月</text><text x="'+(w-p.r-14)+'" y="'+(h-3)+'">12月</text>':'';
  el('#line').innerHTML='<svg class="line-chart" viewBox="0 0 '+w+' '+h+'">'+grid+'<path d="'+smooth+'" fill="none" stroke="#303938" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+xAxis+'</svg>'}
function dailySquares(){let b=bounds(),count=Math.round((b.end-b.start)/86400000)+1,cols=range==='week'?3:range==='month'?6:20,grid=el('#dailyGrid');grid.style.setProperty('--columns',cols);grid.innerHTML='';for(let i=0;i<count;i++){let d=new Date(b.start);d.setDate(b.start.getDate()+i);let date=iso(d),v=val(date),cell=document.createElement('button');cell.className='daily-cell '+(v?classes[v-1]+' ':'')+(date===iso(today)?'today-cell ':'');cell.title=fullFmt.format(d)+(v?'：'+labels[v-1]:'：未记录');cell.onclick=()=>{chosen=date;shown=new Date(d.getFullYear(),d.getMonth(),1);render()};grid.append(cell)}let blanks=(cols-count%cols)%cols;for(let i=0;i<blanks;i++){let blank=document.createElement('i');blank.className='daily-cell empty';grid.append(blank)}}
function renderStats(){let rows=data(),b=bounds(),average=rows.length?(rows.reduce((s,x)=>s+x.energy,0)/rows.length).toFixed(1):'—';el('#stat').innerHTML='<span class="eyebrow">'+b.label+' · 已记录 '+rows.length+' 天</span><strong>'+average+' <small style="font-size:14px;font-weight:500">/ 3</small></strong><p>'+ (rows.length?'这是该范围内已记录日期的平均状态。':'选择日历上的日期开始记录。')+'</p>';pie(rows);line(rows);dailySquares();el('#chartNote').textContent=range==='year'?'年视图按月汇总平均状态，折线：绝望 = 1、逃避 = 2、希望 = 3。':'折线：绝望 = 1、逃避 = 2、希望 = 3。仅显示「'+b.label+'」中已记录的日期。'}
function render(){renderCalendar();renderPicker();renderStats();el('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.range===range))}
levels.onclick=e=>{let b=e.target.closest('button');if(b)record(chosen,+b.dataset.v)};el('#remove').onclick=()=>{put(all().filter(x=>x.date!==chosen));render()};el('#prev').onclick=()=>{shown.setMonth(shown.getMonth()-1);render()};el('#next').onclick=()=>{shown.setMonth(shown.getMonth()+1);render()};el('#jump').onclick=()=>{let match=el('#jumpMonth').value.match(/^(\d{4,})-(\d{2})$/);if(!match)return;shown=new Date(+match[1],+match[2]-1,1);chosen=iso(shown);render()};el('#goToday').onclick=()=>{shown=new Date(today.getFullYear(),today.getMonth(),1);chosen=iso(today);render()};el('#tabs').onclick=e=>{let b=e.target.closest('button');if(b){range=b.dataset.range;render()}};el('#clear').onclick=()=>{if(confirm('确定清空这台设备上的所有记录吗？')){localStorage.removeItem(KEY);render()}};render();
</script>
</body></html>
